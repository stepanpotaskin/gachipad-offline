plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gachipad.soundboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.gachipad.soundboard"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetSdk 34
        sourceCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
