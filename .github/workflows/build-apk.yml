name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle 78 Gachi Sounds and Offline Assets
        run: |
          python3 -c "
          import urllib.request, urllib.parse, json, os

          BASE = 'https://deft-babka-206cf3.netlify.app'
          DEST = 'android/app/src/main/assets'
          os.makedirs(f'{DEST}/assets/audio', exist_ok=True)
          os.makedirs(f'{DEST}/assets/images/lords', exist_ok=True)
          os.makedirs(f'{DEST}/assets/icons', exist_ok=True)
          os.makedirs(f'{DEST}/css', exist_ok=True)
          os.makedirs(f'{DEST}/js/data', exist_ok=True)

          def fetch(rel):
              safe_rel = urllib.parse.quote(rel)
              url = f'{BASE}/{safe_rel}'
              path = f'{DEST}/{rel}'
              os.makedirs(os.path.dirname(path), exist_ok=True)
              urllib.request.urlretrieve(url, path)

          # Core web files
          for f in ['index.html', 'manifest.json', 'sw.js', 'css/style.css', 'js/app.js', 'js/audio.js', 'js/theme.js', 'js/data/sounds.js', 'js/data/lords.js', 'assets/icons/icon-192.png', 'assets/icons/icon-512.png', 'assets/icons/app_icon.svg', 'assets/icons/avatar_placeholder.svg']:
              fetch(f)
              print('Fetched core file:', f)

          # Parse sounds.js to download all 78 sounds
          with open(f'{DEST}/js/data/sounds.js', 'r', encoding='utf-8') as s_file:
              text = s_file.read()
              json_str = text.split('const SOUNDS = ')[1].split(';\n\nif')[0]
              sounds = json.loads(json_str)

          print(f'Downloading {len(sounds)} audio files...')
          for s in sounds:
              fetch(f'assets/audio/{s[\"file\"]}')

          # Parse lords.js to download all photos
          with open(f'{DEST}/js/data/lords.js', 'r', encoding='utf-8') as l_file:
              for line in l_file:
                  if 'url:' in line:
                      img_rel = line.split('url:')[1].split(\"'\" if \"'\" in line else '\"')[1].replace('./', '')
                      fetch(urllib.parse.unquote(img_rel))

          print('All 78 sounds and lord assets successfully bundled into APK!')
          "

      - name: Build Standalone Offline APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GachiPad-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          tag_name: v1.0.0-offline
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "GachiPad Mobile v1.0 (100% Offline Standalone)"
          body: "100% автономный оффлайн Гачимучи саундпад. Все 78 звуков зашиты внутрь APK. Не требует интернета, не открывает браузер."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
